# =====================================================================
#  Software Template Backstage : portfolio-nextjs-template
#  Golden path : formulaire -> code Next.js + Docker + CI -> GitHub -> Catalog
# =====================================================================
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: portfolio-nextjs-template
  title: Portfolio Next.js (Docker + Docker Hub + CI/CD)
  description: >-
    Génère un Portfolio Next.js prêt à conteneuriser (Dockerfile, .dockerignore,
    docker-compose.yml, workflow CI/CD), crée le dépôt GitHub, configure les
    secrets Docker Hub et enregistre le composant dans le Catalog.
  tags: [nextjs, docker, portfolio, golden-path]
spec:
  owner: user:default/guest
  type: website

  # ---------------------------------------------------------------
  # 1) LE FORMULAIRE (chaque bloc = une page de l'assistant)
  # ---------------------------------------------------------------
  parameters:
    - title: Informations personnelles
      required: [fullName, jobTitle, email]
      properties:
        fullName:
          title: Nom complet
          type: string
          default: Amal Jemli
        jobTitle:
          title: Titre
          type: string
          default: Étudiante Master DevOps & Cloud
        email:
          title: E-mail
          type: string
          format: email
        location:
          title: Ville
          type: string
          default: Tozeur, Tunisie
        githubUser:
          title: Compte GitHub (affiché sur le portfolio)
          type: string
          default: Amal356
        about:
          title: À propos (une phrase)
          type: string
          ui:widget: textarea
          default: Je construis des plateformes DevOps et Cloud automatisées.

    - title: Dépôt GitHub et catalogue
      required: [repoUrl, owner]
      properties:
        repoUrl:
          title: Dépôt à créer
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            allowedOwners: [Amal356]
        owner:
          title: Propriétaire dans le catalogue
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Docker Hub
      required: [dockerhubUser, imageName, dockerhubToken]
      properties:
        dockerhubUser:
          title: Utilisateur Docker Hub
          type: string
          default: amal878
        imageName:
          title: Nom de l'image
          type: string
          default: portfolio-nextjs
          pattern: '^[a-z0-9]+([._-][a-z0-9]+)*$'
        dockerhubToken:
          title: Jeton d'accès Docker Hub (Read & Write)
          description: Stocké uniquement comme secret chiffré du dépôt GitHub.
          type: string
          ui:field: Secret

  # ---------------------------------------------------------------
  # 2) LES ACTIONS (exécutées par le scaffolder, dans l'ordre)
  # ---------------------------------------------------------------
  steps:
    - id: fetch
      name: Générer le projet (Next.js + Docker + CI)
      action: fetch:template
      input:
        url: ./skeleton
        # Les workflows GitHub utilisent aussi la syntaxe ${{ }} :
        # on les copie tels quels pour que Backstage ne les interprète pas.
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          repoOwner: ${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}
          owner: ${{ parameters.owner }}
          fullName: ${{ parameters.fullName }}
          jobTitle: ${{ parameters.jobTitle }}
          email: ${{ parameters.email }}
          location: ${{ parameters.location }}
          githubUser: ${{ parameters.githubUser }}
          about: ${{ parameters.about }}
          dockerhubUser: ${{ parameters.dockerhubUser }}
          imageName: ${{ parameters.imageName }}

    - id: publish
      name: Créer le dépôt GitHub et pousser le code
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: Portfolio Next.js de ${{ parameters.fullName }} (généré par Backstage)
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false
        gitCommitMessage: 'feat: projet généré par Backstage (portfolio-nextjs-template)'
        gitAuthorName: Backstage Scaffolder
        topics: [backstage, nextjs, docker, portfolio]
        # Variables (non secrètes) et secret (chiffré) utilisés par le workflow
        repoVariables:
          DOCKERHUB_USERNAME: ${{ parameters.dockerhubUser }}
          IMAGE_NAME: ${{ parameters.imageName }}
        secrets:
          DOCKERHUB_TOKEN: ${{ secrets.dockerhubToken }}

    - id: register
      name: Enregistrer le composant dans le Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # ---------------------------------------------------------------
  # 3) CE QUE L'UTILISATEUR VOIT À LA FIN
  # ---------------------------------------------------------------
  output:
    links:
      - title: Dépôt GitHub
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ouvrir dans le catalogue
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
